<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinemax - Movie Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            CINEMAX
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="movies.html">
                Movies
            </a>

            <a href="#login">
                Login
            </a>

        </div>

    </nav>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <section class="hero">

        <div class="hero-content">

            <small>
                WELCOME TO CINEMAX
            </small>

            <h1>
                Experience Movies
                <br>
                Like Never Before
            </h1>

            <p>
                Book your favourite movies, choose your
                preferred seats, and enjoy an unforgettable
                cinema experience.
            </p>

            <a href="movies.html">

                <button class="hero-button">
                    Browse Movies
                </button>

            </a>

        </div>

    </section>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <section class="login-section" id="login">

        <div class="login-card">

            <h2>
                Welcome Back
            </h2>

            <p class="subtitle">
                Login to continue booking your tickets
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm" action="login.php" method="POST">

                <!-- EMAIL -->

                <div class="input-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small
                        id="loginEmailError"
                        class="error-message">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <small
                        id="loginPasswordError"
                        class="error-message">
                    </small>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="button"
                class="register-button"
                onclick="showRegister()">

                Create New Account

            </button>


            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <div
                id="register-box"
                class="register-box">

                <h3>
                    Create Account
                </h3>


                <form
                    id="registerForm"
                    action="register.php"
                    method="POST">


                    <!-- NAME -->

                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                        <small
                            id="nameError"
                            class="error-message">
                        </small>

                    </div>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="register-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                        <small
                            id="registerEmailError"
                            class="error-message">
                        </small>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="register-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <small
                            id="registerPasswordError"
                            class="error-message">
                        </small>

                    </div>


                    <button
                        type="submit"
                        class="login-button">

                        Create Account

                    </button>

                </form>

            </div>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 CINEMAX.
            All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT VALIDATION
    ========================== -->

    <script>

        // =========================
        // SHOW REGISTER FORM
        // =========================

        function showRegister() {

            const registerBox =
                document.getElementById("register-box");

            if (registerBox.style.display === "block") {

                registerBox.style.display = "none";

            } else {

                registerBox.style.display = "block";

            }

        }


        // =========================
        // NAME VALIDATION
        // =========================

        function validateName(name) {

            const namePattern =
                /^[A-Za-z ]+$/;

            return namePattern.test(name);

        }


        // =========================
        // EMAIL VALIDATION
        // =========================

        function validateEmail(email) {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return emailPattern.test(email);

        }


        // =========================
        // PASSWORD VALIDATION
        // =========================

        function validatePassword(password) {

            return password.length >= 6;

        }


        // =========================
        // NAME - LIVE VALIDATION
        // =========================

        document
            .getElementById("name")
            .addEventListener(
                "input",
                function() {

                    // Allow letters and spaces only
                    this.value =
                        this.value.replace(
                            /[^A-Za-z ]/g,
                            ""
                        );

                    const name =
                        this.value;

                    const error =
                        document.getElementById(
                            "nameError"
                        );

                    if (
                        name !== "" &&
                        !validateName(name)
                    ) {

                        error.textContent =
                            "Name can contain letters and spaces only.";

                    } else {

                        error.textContent = "";

                    }

                }
            );


        // =========================
        // REGISTER FORM
        // =========================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                function(event) {

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("register-email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("register-password")
                            .value;


                    let valid = true;


                    // NAME

                    if (!validateName(name)) {

                        document
                            .getElementById("nameError")
                            .textContent =
                            "Enter a valid name using letters and spaces only.";

                        valid = false;

                    } else {

                        document
                            .getElementById("nameError")
                            .textContent = "";

                    }


                    // EMAIL

                    if (!validateEmail(email)) {

                        document
                            .getElementById("registerEmailError")
                            .textContent =
                            "Enter a valid email address.";

                        valid = false;

                    } else {

                        document
                            .getElementById("registerEmailError")
                            .textContent = "";

                    }


                    // PASSWORD

                    if (!validatePassword(password)) {

                        document
                            .getElementById("registerPasswordError")
                            .textContent =
                            "Password must contain at least 6 characters.";

                        valid = false;

                    } else {

                        document
                            .getElementById("registerPasswordError")
                            .textContent = "";

                    }


                    // STOP FORM IF INVALID

                    if (!valid) {

                        event.preventDefault();

                    }

                }
            );


        // =========================
        // LOGIN FORM
        // =========================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    const email =
                        document
                            .getElementById("login-email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("login-password")
                            .value;


                    let valid = true;


                    // EMAIL

                    if (!validateEmail(email)) {

                        document
                            .getElementById("loginEmailError")
                            .textContent =
                            "Enter a valid email address.";

                        valid = false;

                    } else {

                        document
                            .getElementById("loginEmailError")
                            .textContent = "";

                    }


                    // PASSWORD

                    if (!validatePassword(password)) {

                        document
                            .getElementById("loginPasswordError")
                            .textContent =
                            "Password must contain at least 6 characters.";

                        valid = false;

                    } else {

                        document
                            .getElementById("loginPasswordError")
                            .textContent = "";

                    }


                    // STOP LOGIN IF INVALID

                    if (!valid) {

                        event.preventDefault();

                    }

                }
            );

    </script>

</body>

</html>
