<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CineMax - Booking</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">CineMax</div>

    <nav>

        <a href="index.html">Home</a>

        <a href="movies.html">Movies</a>

        <a href="booking.html">Booking</a>

    </nav>

</header>


<section class="page-title">

    <span class="tag">
        BOOK YOUR TICKETS
    </span>

    <h1>
        Select Your Seats
    </h1>

    <p>
        Booking is available for today
        and the next 2 days.
    </p>

</section>


<section class="booking-container">


    <!-- BOOKING DETAILS -->

    <div class="card">

        <h2>Booking Details</h2>

        <label>
            Movie
        </label>

        <select
            id="movieSelect"
            required>
        </select>


        <label>
            Booking Date
        </label>

        <input
            type="date"
            id="bookingDate"
            required
        >


        <label>
            Show Time
        </label>

        <select id="showTime">

            <option value="10:00 AM">
                10:00 AM
            </option>

            <option value="01:30 PM">
                01:30 PM
            </option>

            <option value="04:30 PM">
                04:30 PM
            </option>

            <option value="07:30 PM">
                07:30 PM
            </option>

        </select>


        <label>
            Number of Tickets
        </label>

        <select id="tickets">

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>

        </select>


        <div class="price-box">

            Ticket Price:
            ₹<span id="ticketPrice">0</span>

            <br><br>

            Total:
            ₹<span id="totalPrice">0</span>

        </div>

    </div>


    <!-- SEATS -->

    <div class="card">

        <h2>Select Seats</h2>

        <div class="screen">
            SCREEN
        </div>


        <div class="legend">

            <span>
                ⬜ Available
            </span>

            <span>
                🟥 Selected
            </span>

            <span>
                ⬛ Booked
            </span>

        </div>


        <div
            id="seatContainer"
            class="seat-map">
        </div>


        <p
            id="seatMsg"
            class="message">

            Select your seats.

        </p>


        <button
            id="confirmBtn"
            class="btn full">

            Confirm Booking

        </button>

    </div>

</section>


<footer>
    © 2026 CineMax Movie Booking
</footer>


<script src="script.js"></script>

</body>
</html>
