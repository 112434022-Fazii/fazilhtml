<head>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        CineMax
    </div>

    <nav>

        <a href="index.html">
            Home

        <a href="movies.html">
            Movies
        </a>

        <a href="booking.html">

        </a>

            Book Another Movie
