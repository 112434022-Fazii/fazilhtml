<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CineMax - Confirmation</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">🎬 CineMax</div>

    <nav>

        <a href="index.html">Home</a>

        <a href="movies.html">Movies</a>

        <a href="booking.html">Booking</a>

        <button id="logoutBtn" onclick="logoutUser()">Logout</button>

    </nav>

</header>


<section class="confirmation-page">

    <div class="confirmation-box">

        <div class="success-icon">
            ✓
        </div>

        <h1>Booking Confirmed!</h1>

        <p>
            Your tickets have been booked successfully.
        </p>


        <div class="ticket-card">

            <div class="ticket-row">

                <span>Booking ID</span>

                <strong id="bookingId"></strong>

            </div>

            <div class="ticket-row">

                <span>Movie</span>

                <strong id="confirmMovie"></strong>

            </div>

            <div class="ticket-row">

                <span>Date</span>

                <strong id="confirmDate"></strong>

            </div>

            <div class="ticket-row">

                <span>Show Time</span>

                <strong id="confirmTime"></strong>

            </div>

            <div class="ticket-row">

                <span>Seats</span>

                <strong id="confirmSeats"></strong>

            </div>

            <div class="ticket-row">

                <span>Tickets</span>

                <strong id="confirmTickets"></strong>

            </div>

            <div class="ticket-row total-row">

                <span>Total Amount</span>

                <strong id="confirmTotal"></strong>

            </div>

        </div>


        <div class="confirmation-buttons">

            <a
                href="movies.html"
                class="main-btn"
            >
                Book Another Movie
            </a>

            <a
                href="index.html"
                class="home-link"
            >
                Back to Home
            </a>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 CineMax Movie Booking System
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
